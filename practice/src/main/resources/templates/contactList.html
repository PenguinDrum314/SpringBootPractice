<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
	<meta charset="UTF-8">
	<title>お問い合わせ内容一覧</title>
</head>

<body>
	<h1>お問い合わせ内容一覧</h1>
	<table border="1">
		<thead>
			<tr>
				<td>お問い合わせID</td>
				<td>姓</td>
				<td>名</td>
				<td>お問い合わせ種別</td>
				<td>作成日時</td>
				<td>更新日時</td>
			</tr>
		</thead>
		<tbody>
			<!-- th:each 同じタグを繰り返し表示するためのループ処理 -->
			<tr th:each="contact : ${contactList}">
				<td th:text="${contact.id}">お問い合わせID</td>
				<td th:text="${contact.lastName}">姓</td>
				<td th:text="${contact.firstName}">名</td>
				<!-- th:if　contactTypeの値が一致している場合に表示する -->
				<td>
					<span th:if="${contact.contactType == 'services'}">
						サービスに関するお問い合わせ
					</span>
					<span th:if="${contact.contactType == 'technicalQuestions'}">
						技術的なお問い合わせ
					</span>
					<span th:if="${contact.contactType == 'others'}">
						その他
					</span>
				</td>
				<!-- #temporals.format: 日時データを見やすい形式(yyyy/MM/dd HH:mm)の文字列に変換して表示する -->
				<td th:text="${#temporals.format(contact.createdAt, 'yyyy/MM/dd HH:mm')}">作成日時</td>
				<td th:text="${#temporals.format(contact.updatedAt, 'yyyy/MM/dd HH:mm')}">更新日時</td>
				<td>
					<a th:href="@{/admin/contacts/{id}(id=${contact.id})}">詳細</a>
					<a th:href="@{/admin/contacts/{id}(id=${contact.id})}">編集</a>
				</td>
			</tr>
		</tbody>
	</table>
</body>

</html>
